; ==========================================================
; PHP Configuration
; PHP設定
; ==========================================================

; Display errors during development
; 開発中にエラーを表示します。
display_errors = On

; Display PHP startup errors
; PHP起動時のエラーを表示します。
display_startup_errors = On

; Report all PHP errors
; すべてのPHPエラーを報告します。
error_reporting = E_ALL

; Set the default character encoding
; デフォルトの文字コードをUTF-8にします。
default_charset = "UTF-8"

; Set the timezone
; タイムゾーンを日本時間に設定します。
date.timezone = "Asia/Tokyo"

; Set the maximum size of uploaded files
; アップロードできるファイルの最大サイズを設定します。
upload_max_filesize = 20M

; Set the maximum size of POST data
; POSTデータの最大サイズを設定します。
post_max_size = 20M